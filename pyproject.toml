[project]
name = "skydance"
version = "3.0.0"
description = "A library for communication with Skydance Wi-Fi relays."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Tomas Bedrich", email = "ja@tbedrich.cz" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: System :: Hardware",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://pypi.org/project/skydance"
Repository = "https://github.com/tomasbedrich/skydance"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D202"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["F403", "F405"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["skydance"]
lines-after-imports = 2

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli = true
log_cli_level = "INFO"
addopts = ["--strict-markers", "-r sxX"]
