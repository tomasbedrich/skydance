name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv build
      - run: uv publish
